<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame-by-Frame Video Player</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #eee;
        font-family: sans-serif;
    }
    .player {
        text-align: center;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    img {
        width: 300px;
        height: 300px;
        object-fit: contain;
    }
    button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="player">
    <img id="frame" src="" alt="Frame">
    <h2>Frame-by-Frame Video</h2>

    <button onclick="rewind()">⏪ -10s</button>
    <button onclick="togglePlay()">▶️ / ⏸</button>
    <button onclick="fastForward()">⏩ +10s</button>
</div>

<script>
    /* ------------------------------
       1. Load your frames here
       ------------------------------ */
    const frames = [
        "https://media.geeksforgeeks.org/wp-content/uploads/20210721215006/frame1.PNG",
        "https://media.geeksforgeeks.org/wp-content/uploads/20210721215014/frame2-200x190.PNG",
        "https://media.geeksforgeeks.org/wp-content/uploads/20210721215021/frame3-200x182.PNG"
        // Add all your frames here in order
    ];

    /* ------------------------------
       2. Playback settings
       ------------------------------ */
    const FPS = 30;
    const FRAME_TIME = 1000 / FPS; // 33.33ms
    const JUMP_FRAMES = FPS * 10;  // 10 seconds = 300 frames

    let index = 0;
    let playing = true;
    let interval = null;

    const img = document.getElementById("frame");

    /* ------------------------------
       3. Animation loop
       ------------------------------ */
    function playFrame() {
        index++;

        if (index >= frames.length) {
            index = frames.length - 1; // stop at end
            playing = false;
            clearInterval(interval);
        }

        img.src = frames[index];
    }

    function startPlayback() {
        interval = setInterval(playFrame, FRAME_TIME);
    }

    function stopPlayback() {
        clearInterval(interval);
    }

    function togglePlay() {
        playing = !playing;
        if (playing) startPlayback();
        else stopPlayback();
    }

    /* ------------------------------
       4. Rewind / Fast-forward
       ------------------------------ */
    function rewind() {
        index -= JUMP_FRAMES;
        if (index < 0) index = 0;
        img.src = frames[index];
    }

    function fastForward() {
        index += JUMP_FRAMES;
        if (index >= frames.length) index = frames.length - 1;
        img.src = frames[index];
    }

    /* ------------------------------
       5. Start automatically
       ------------------------------ */
    img.src = frames[0];
    startPlayback();
</script>

</body>
</html>
